[package]
name = "tyut-keepalive"
version = "0.1.0"
edition = "2021"
description = "TYUT campus network auto-login, implemented in Rust"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
netdev = { version = "0.47", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "query", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.27"
