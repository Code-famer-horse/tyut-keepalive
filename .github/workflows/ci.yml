name: Development CI
on:
  push:
    branches: ['develop/v0.4.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/platform-checks.yml
    with:
      os: ${{ matrix.os }}
