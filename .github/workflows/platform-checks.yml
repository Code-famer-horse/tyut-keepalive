name: Platform checks
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check frontend
        run: |
          npm run check:html
          node --check dist/main.js
          node --check dist/ui-state.js
          node --test scripts/test_ui.mjs
      - name: Resolve dependencies
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Compile release configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Save resolved lockfile
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
